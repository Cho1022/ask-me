<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title description">
  <title id="title">Ask Me Voice Kiosk AWS 배포 목표 아키텍처</title>
  <desc id="description">향후 AWS 배포 파이프라인은 GitHub, GitHub Actions, Docker를 사용합니다. Vue, TypeScript, Vite 정적 결과물은 S3와 CloudFront에 배포됩니다. Docker 이미지는 Application Load Balancer 뒤의 ECR과 ECS Fargate에 배포됩니다. RDS for MySQL이 데이터를 저장하고, Google Cloud Speech-to-Text는 NAT Gateway를 통해 호출합니다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16202A" flood-opacity="0.12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26323D"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#147EFB"/></marker>
    <style>
      .title { font: 700 28px "Segoe UI", "Noto Sans KR", sans-serif; fill: #18212B; }
      .subtitle { font: 400 14px "Segoe UI", "Noto Sans KR", sans-serif; fill: #5C6670; }
      .group { font: 700 16px "Segoe UI", "Noto Sans KR", sans-serif; fill: #18212B; }
      .label { font: 700 14px "Segoe UI", "Noto Sans KR", sans-serif; fill: #1D2731; }
      .body { font: 400 12px "Segoe UI", "Noto Sans KR", sans-serif; fill: #56616C; }
      .small { font: 400 11px "Segoe UI", "Noto Sans KR", sans-serif; fill: #66727D; }
      .aws { font: 700 13px "Segoe UI", "Noto Sans KR", sans-serif; fill: #27313B; }
      .flow { font: 700 11px "Segoe UI", "Noto Sans KR", sans-serif; fill: #1B5FAF; }
    </style>
  </defs>
  <rect width="1900" height="1080" fill="#FFFFFF"/>
  <rect width="1900" height="8" fill="#FF9900"/>
  <text x="52" y="53" class="title">AWS 배포 목표 아키텍처</text>
  <text x="52" y="79" class="subtitle">Vue·TypeScript·Spring Boot·MySQL 기반 Ask Me Voice Kiosk의 AWS 배포 목표 구조</text>

  <!-- CI/CD -->
  <rect x="54" y="142" width="378" height="188" rx="10" fill="#FFFFFF" stroke="#4E5965" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="76" y="174" class="group">CI/CD</text>
  <image href="brand-icons/github.svg" x="91" y="198" width="62" height="62"/>
  <text x="122" y="286" text-anchor="middle" class="label">GitHub</text>
  <path d="M162 229 H219" fill="none" stroke="#26323D" stroke-width="2" marker-end="url(#arrow)"/>
  <image href="brand-icons/github-actions.svg" x="235" y="198" width="62" height="62"/>
  <text x="266" y="286" text-anchor="middle" class="label">GitHub Actions</text>
  <path d="M307 229 H345" fill="none" stroke="#26323D" stroke-width="2" marker-end="url(#arrow)"/>
  <image href="brand-icons/docker.svg" x="341" y="196" width="70" height="70"/>
  <text x="376" y="286" text-anchor="middle" class="label">Docker</text>

  <!-- Frontend build -->
  <rect x="482" y="136" width="220" height="194" fill="#FFFFFF" stroke="#26323D" stroke-width="2"/>
  <text x="592" y="169" text-anchor="middle" class="group">프론트엔드 빌드</text>
  <image href="brand-icons/vue.svg" x="512" y="192" width="48" height="48"/>
  <image href="brand-icons/typescript.svg" x="569" y="195" width="42" height="42"/>
  <image href="brand-icons/vite.svg" x="626" y="192" width="48" height="48"/>
  <text x="592" y="270" text-anchor="middle" class="body">Vue 3 · TypeScript · Vite</text>
  <text x="592" y="293" text-anchor="middle" class="small">정적 빌드 결과</text>

  <!-- User -->
  <image href="aws-icons/client.svg" x="144" y="486" width="72" height="72"/>
  <text x="180" y="589" text-anchor="middle" class="label">키오스크 사용자</text>
  <text x="180" y="612" text-anchor="middle" class="body">브라우저 · 터치 · 마이크</text>

  <!-- AWS Cloud and Region -->
  <rect x="740" y="112" width="1110" height="758" fill="#FFFFFF" stroke="#7B8793" stroke-width="2"/>
  <image href="aws-icons/aws-cloud.svg" x="754" y="125" width="28" height="28"/>
  <text x="790" y="147" class="group">AWS Cloud</text>
  <rect x="772" y="164" width="1046" height="666" fill="#FCFEFF" stroke="#00A1B3" stroke-width="2" stroke-dasharray="8 7"/>
  <image href="aws-icons/region.svg" x="787" y="178" width="25" height="25"/>
  <text x="819" y="198" class="group" fill="#008D9A">Region · ap-northeast-2</text>

  <!-- CDN / storage -->
  <image href="aws-icons/s3.svg" x="838" y="270" width="72" height="72"/>
  <text x="874" y="366" text-anchor="middle" class="aws">Amazon S3</text>
  <text x="874" y="387" text-anchor="middle" class="body">Vue 정적 빌드 결과물</text>
  <image href="aws-icons/cloudfront.svg" x="880" y="488" width="72" height="72"/>
  <text x="916" y="584" text-anchor="middle" class="aws">CloudFront</text>
  <text x="916" y="605" text-anchor="middle" class="body">HTTPS · 정적 파일 제공</text>

  <!-- ECR -->
  <image href="aws-icons/ecr.svg" x="1562" y="244" width="72" height="72"/>
  <text x="1598" y="340" text-anchor="middle" class="aws">Amazon ECR</text>
  <text x="1598" y="361" text-anchor="middle" class="body">Spring Boot 이미지</text>

  <!-- VPC -->
  <rect x="1080" y="330" width="666" height="446" fill="#FFFFFF" stroke="#8E56E9" stroke-width="3"/>
  <image href="aws-icons/vpc.svg" x="1095" y="343" width="27" height="27"/>
  <text x="1130" y="365" class="group" fill="#7443C8">VPC</text>

  <!-- Public subnet -->
  <rect x="1112" y="387" width="205" height="340" fill="#F4F8EB" stroke="#7BA317" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1132" y="416" class="aws" fill="#5C8610">Public subnet</text>
  <image href="aws-icons/alb.svg" x="1175" y="455" width="68" height="68"/>
  <text x="1210" y="548" text-anchor="middle" class="aws">ALB</text>
  <text x="1210" y="569" text-anchor="middle" class="body">`/api` routing</text>
  <image href="aws-icons/nat-gateway.svg" x="1176" y="621" width="64" height="64"/>
  <text x="1210" y="709" text-anchor="middle" class="aws">NAT Gateway</text>

  <!-- Private app subnet -->
  <rect x="1350" y="387" width="362" height="184" fill="#EBF8FA" stroke="#00A1B3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1370" y="416" class="aws" fill="#008D9A">Private app subnet</text>
  <image href="aws-icons/ecs.svg" x="1380" y="444" width="68" height="68"/>
  <text x="1460" y="465" class="aws">ECS Fargate service</text>
  <text x="1460" y="486" class="body">Spring Boot 컨테이너</text>
  <rect x="1460" y="507" width="220" height="45" rx="6" fill="#FFFFFF" stroke="#147EFB" stroke-width="1.5" stroke-dasharray="5 4"/>
  <image href="brand-icons/docker.svg" x="1472" y="515" width="30" height="30"/>
  <image href="brand-icons/java.svg" x="1530" y="514" width="31" height="31"/>
  <image href="brand-icons/spring-boot.svg" x="1592" y="514" width="31" height="31"/>
  <text x="1648" y="535" text-anchor="middle" class="small">주문 API</text>
  <image href="aws-icons/secrets-manager.svg" x="1660" y="438" width="38" height="38"/>

  <!-- Private data subnet -->
  <rect x="1350" y="614" width="362" height="114" fill="#EBF8FA" stroke="#00A1B3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1370" y="642" class="aws" fill="#008D9A">Private data subnet</text>
  <image href="aws-icons/rds.svg" x="1400" y="655" width="62" height="62"/>
  <image href="brand-icons/mysql.svg" x="1480" y="655" width="62" height="62"/>
  <text x="1580" y="680" text-anchor="middle" class="aws">RDS for MySQL</text>
  <text x="1580" y="704" text-anchor="middle" class="body">메뉴 · 주문 · 스냅샷</text>

  <!-- External STT -->
  <rect x="1275" y="920" width="440" height="96" rx="12" fill="#FFFFFF" stroke="#4E5965" stroke-width="2" stroke-dasharray="7 6"/>
  <image href="brand-icons/google-cloud.svg" x="1310" y="940" width="56" height="56"/>
  <text x="1390" y="960" class="label">Google Cloud Speech-to-Text V1</text>
  <text x="1390" y="985" class="body">외부 음성 인식 API · `ko-KR`</text>

  <!-- Delivery and request flows -->
  <path d="M432 235 H482" fill="none" stroke="#147EFB" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#blue)"/>
  <path d="M702 235 H785 V251 H874 V270" fill="none" stroke="#147EFB" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#blue)"/>
  <text x="756" y="222" class="flow">정적 빌드 배포</text>
  <path d="M432 235 H785 V130 H1598 V244" fill="none" stroke="#147EFB" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#blue)"/>
  <text x="1010" y="122" class="flow">백엔드 이미지 빌드·푸시</text>
  <path d="M1598 316 V444" fill="none" stroke="#147EFB" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#blue)"/>

  <path d="M216 525 H880" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="555" y="510" text-anchor="middle" class="small">HTTPS</text>
  <path d="M874 342 V488" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M952 524 H1175" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1060" y="510" text-anchor="middle" class="small">`/api`</text>
  <path d="M1243 489 H1380" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1480 571 V655" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1492" y="617" class="small">JPA / JDBC</text>
  <path d="M1414 512 V754 H1210 V685" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1210 685 V880 H1495 V920" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1250" y="867" class="small">외부 HTTPS · 음성 ↔ 변환 텍스트</text>
  <text x="52" y="1053" class="small">배포 목표: GitHub Actions → S3/ECR → CloudFront/ECS · 실제 AWS 리소스와 배포 권한은 이 구조에 맞춰 별도 프로비저닝합니다.</text>
  <text x="1848" y="1053" text-anchor="end" class="small">AWS Architecture Icons 2026 Q2 · product logos</text>
</svg>
