<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="810" viewBox="0 0 1500 810" role="img" aria-labelledby="title description">
  <title id="title">Ask Me Voice Kiosk 현재 실행 아키텍처</title>
  <desc id="description">GitHub Actions가 프로젝트를 검증합니다. 키오스크 브라우저는 Docker Compose의 Nginx가 제공하는 Vue, TypeScript, Vite 프론트엔드에 접속합니다. Nginx는 API 호출을 Java Spring Boot 백엔드로 프록시하며, 백엔드는 MySQL에 데이터를 저장하고 Google Cloud Speech-to-Text를 호출합니다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16202A" flood-opacity="0.13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#26323D"/></marker>
    <style>
      .title { font: 700 28px "Segoe UI", "Noto Sans KR", sans-serif; fill: #18212B; }
      .subtitle { font: 400 14px "Segoe UI", "Noto Sans KR", sans-serif; fill: #5B6570; }
      .group { font: 700 16px "Segoe UI", "Noto Sans KR", sans-serif; fill: #18212B; }
      .label { font: 700 15px "Segoe UI", "Noto Sans KR", sans-serif; fill: #1D2731; }
      .body { font: 400 13px "Segoe UI", "Noto Sans KR", sans-serif; fill: #56616C; }
      .small { font: 400 11px "Segoe UI", "Noto Sans KR", sans-serif; fill: #65717C; }
      .arrow-label { font: 700 11px "Segoe UI", "Noto Sans KR", sans-serif; fill: #44515D; }
    </style>
  </defs>
  <rect width="1500" height="810" fill="#FFFFFF"/>
  <rect width="1500" height="8" fill="#FF9900"/>
  <text x="52" y="53" class="title">현재 실행 아키텍처</text>
  <text x="52" y="79" class="subtitle">현재 구현 기준 · Docker Compose에서 실행되는 Vue·Spring Boot·MySQL 주문 키오스크</text>

  <!-- Current CI -->
  <rect x="54" y="137" width="320" height="155" rx="10" fill="#FFFFFF" stroke="#4F5B66" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="75" y="169" class="group">CI</text>
  <image href="brand-icons/github.svg" x="94" y="188" width="58" height="58"/>
  <text x="123" y="269" text-anchor="middle" class="label">GitHub</text>
  <path d="M160 217 H220" fill="none" stroke="#26323D" stroke-width="2" marker-end="url(#arrow)"/>
  <image href="brand-icons/github-actions.svg" x="236" y="188" width="58" height="58"/>
  <text x="265" y="269" text-anchor="middle" class="label">GitHub Actions</text>
  <text x="214" y="286" text-anchor="middle" class="small">프론트엔드 테스트/빌드 · 백엔드 테스트/빌드</text>

  <!-- Kiosk user -->
  <g filter="url(#shadow)">
    <rect x="84" y="410" width="210" height="160" rx="14" fill="#FFFFFF" stroke="#D9DEE3"/>
    <rect x="84" y="410" width="6" height="160" rx="3" fill="#FF9900"/>
  </g>
  <image href="aws-icons/client.svg" x="157" y="431" width="58" height="58"/>
  <text x="189" y="519" text-anchor="middle" class="label">키오스크 브라우저</text>
  <text x="189" y="544" text-anchor="middle" class="body">터치 · 마이크 · webm/opus</text>

  <!-- Docker Compose runtime -->
  <rect x="414" y="132" width="1008" height="518" rx="16" fill="#FBFDFF" stroke="#2496ED" stroke-width="2" stroke-dasharray="8 7"/>
  <image href="brand-icons/docker.svg" x="436" y="143" width="44" height="44"/>
  <text x="490" y="173" class="group">Docker Compose · 현재 실행 환경</text>
  <text x="490" y="193" class="small">프론트엔드 · 백엔드 · 데이터베이스</text>

  <!-- Frontend -->
  <rect x="454" y="242" width="285" height="336" rx="12" fill="#EEF9F7" stroke="#64C6AE" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="476" y="272" class="label">프론트엔드 컨테이너</text>
  <image href="brand-icons/vue.svg" x="483" y="298" width="52" height="52"/>
  <image href="brand-icons/typescript.svg" x="565" y="304" width="45" height="45"/>
  <image href="brand-icons/vite.svg" x="642" y="298" width="52" height="52"/>
  <text x="510" y="373" text-anchor="middle" class="small">Vue 3</text>
  <text x="587" y="373" text-anchor="middle" class="small">TypeScript</text>
  <text x="668" y="373" text-anchor="middle" class="small">Vite</text>
  <line x1="478" y1="396" x2="715" y2="396" stroke="#BFD8D2"/>
  <image href="brand-icons/nginx.svg" x="486" y="418" width="58" height="58"/>
  <text x="558" y="444" class="label">Nginx</text>
  <text x="486" y="497" class="body">정적 파일 제공</text>
  <text x="486" y="520" class="body">`/api` 역방향 프록시</text>

  <!-- Backend -->
  <rect x="810" y="242" width="310" height="336" rx="12" fill="#F2FAEE" stroke="#8FBE65" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="833" y="272" class="label">백엔드 컨테이너</text>
  <image href="brand-icons/java.svg" x="840" y="298" width="62" height="62"/>
  <image href="brand-icons/spring-boot.svg" x="950" y="302" width="54" height="54"/>
  <text x="870" y="380" text-anchor="middle" class="small">Java 21</text>
  <text x="977" y="380" text-anchor="middle" class="small">Spring Boot 4.1</text>
  <line x1="834" y1="396" x2="1096" y2="396" stroke="#C6DBB7"/>
  <text x="834" y="429" class="body">REST API · 주문 파서 · 메뉴/옵션 검증</text>
  <text x="834" y="455" class="body">서버 가격 재계산 · 트랜잭션 · Flyway</text>

  <!-- Database -->
  <rect x="1178" y="274" width="204" height="272" rx="12" fill="#F0F8FA" stroke="#5FB7C8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1200" y="304" class="label">DB 컨테이너</text>
  <image href="brand-icons/mysql.svg" x="1238" y="330" width="76" height="76"/>
  <text x="1280" y="433" text-anchor="middle" class="label">MySQL 8.4</text>
  <text x="1280" y="462" text-anchor="middle" class="small">메뉴 · 별칭 · 옵션</text>
  <text x="1280" y="482" text-anchor="middle" class="small">주문 · 스냅샷</text>

  <!-- External STT -->
  <rect x="986" y="688" width="390" height="88" rx="12" fill="#FFFFFF" stroke="#4F5B66" stroke-width="2" stroke-dasharray="7 6"/>
  <image href="brand-icons/google-cloud.svg" x="1014" y="708" width="54" height="54"/>
  <text x="1090" y="727" class="label">Google Cloud Speech-to-Text V1</text>
  <text x="1090" y="752" class="body">음성 전사 · `ko-KR` · 동기 인식</text>

  <!-- Flows -->
  <path d="M294 490 H454" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="341" y="464" width="65" height="22" rx="11" fill="#F4F6F8"/><text x="374" y="479" text-anchor="middle" class="arrow-label">HTTP :5173</text>
  <path d="M739 442 H810" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="747" y="415" width="54" height="22" rx="11" fill="#F4F6F8"/><text x="774" y="430" text-anchor="middle" class="arrow-label">/api</text>
  <path d="M1120 442 H1178" fill="none" stroke="#26323D" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="1127" y="415" width="45" height="22" rx="11" fill="#F4F6F8"/><text x="1149" y="430" text-anchor="middle" class="arrow-label">JPA</text>
  <path d="M966 578 V688" fill="none" stroke="#26323D" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="979" y="620" width="83" height="22" rx="11" fill="#F4F6F8"/><text x="1020" y="635" text-anchor="middle" class="arrow-label">음성 ↔ 텍스트</text>
  <text x="54" y="790" class="small">실제 실행 경로: 브라우저 → Nginx/Vue → Spring Boot → MySQL · 음성 전사 시에만 Google Cloud STT 호출</text>
</svg>
