<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Ask Me Voice Kiosk current runtime architecture</title>
  <desc id="diagram-desc">A kiosk browser connects to an Nginx and Vue frontend container. Nginx proxies API requests to a Spring Boot container. Spring Boot stores menus and orders in MySQL and sends voice audio to Google Cloud Speech-to-Text. The three application services run in Docker Compose, not on AWS.</desc>

